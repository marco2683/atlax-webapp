<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas DT Admin Panel</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/css/design-system.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body class="admin-body theme-light">
  
  <div id="admin-login-view" class="admin-login-container">
    <div class="admin-login-box glass-panel">
      <div class="admin-login-header">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="admin-logo"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="4"/><path d="M50 20 L80 80 L20 80 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
        <h1>Atlas DT Admin</h1>
        <p>Restricted Staff Access Only</p>
      </div>
      <form id="admin-login-form">
        <div class="input-group">
          <label>Employee ID / Email</label>
          <input type="text" id="admin-email" name="email" placeholder="staff@atlasdt.com" required>
        </div>
        <div class="input-group">
          <label>Secure Key</label>
          <input type="password" id="admin-pwd" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Authenticate</button>
      </form>
    </div>
  </div>

  <div id="admin-dashboard-view" class="admin-dashboard-layout hidden">
    <!-- Sidebar -->
    <aside class="admin-sidebar glass-panel">
      <div class="admin-brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="4"/><path d="M50 20 L80 80 L20 80 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
        <span>Atlas DT Admin</span>
      </div>
      <nav class="admin-nav">
        <button class="admin-nav-item" data-tab="overview">Overview</button>
        <button class="admin-nav-item" data-tab="suppliers">Suppliers CRM</button>
        <button class="admin-nav-item" data-tab="customers">Customers CRM</button>
        <button class="admin-nav-item" data-tab="rfqs">RFQ Tracker</button>
        <button class="admin-nav-item" data-tab="pricing">Pricing Engine</button>
        <button class="admin-nav-item" data-tab="website">Website Content</button>
        <button class="admin-nav-item" data-tab="marketplace-taxonomy">Marketplace Admin</button>
        <button class="admin-nav-item" data-tab="products">Products</button>
        <button class="admin-nav-item" data-tab="designers">Designer Hub</button>
        <button class="admin-nav-item" data-tab="staff">Staff Accounts</button>
      </nav>
      <div class="admin-user-profile">
        <div class="admin-avatar"></div>
        <div class="admin-user-info">
          <div class="admin-user-name">Systems Admin</div>
          <button id="admin-logout-btn" style="background:transparent;border:none;color:var(--color-slate-400);cursor:pointer;font-size:11px;padding:0;text-align:left;">Log Out</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header glass-panel">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="admin-mobile-toggle" aria-label="Toggle sidebar" 
            onclick="document.getElementById('admin-dashboard-view').classList.toggle('sidebar-open')">☰</button>
          <h2 id="admin-page-title">Platform Overview</h2>
        </div>
        <div class="admin-header-actions" style="display: flex; gap: 12px; align-items: center;">
           <button class="btn btn-secondary" id="admin-theme-toggle" style="padding: 10px; display: flex; align-items: center; justify-content: center;" title="Toggle Light/Dark Theme">
             <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="4.22" x2="19.78" y2="6.34"/></svg>
           </button>
           <button class="btn btn-secondary">Export Data</button>
        </div>
      </header>

      <div class="admin-content-area" id="admin-content-routing">
         <!-- Injected by JS -->
      </div>
    </main>
  </div>

  <!-- Main scripts -->
  <script type="module" src="/src/js/admin.js"></script>

</body>
</html>
