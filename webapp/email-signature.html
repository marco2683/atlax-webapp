<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AtlasDT Email Signature</title>
  <!-- Import Outfit font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Copy everything below this line into your email client -->
  <table cellpadding="0" cellspacing="0" border="0" style="font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; color: #1e293b; min-width: 320px; font-weight: 300;">

          <!-- Make sure to upload your new logo image to your website and replace this URL if needed -->

      </td>
      
      <!-- Right Column: Contact Info -->
      <td valign="middle" style="padding-left: 24px;">
        <h3 style="margin: 0 0 2px 0; font-size: 16px; color: #0f172a; font-weight: 400; letter-spacing: 0.5px;">AtlasDT Team</h3>
        <p style="margin: 0 0 12px 0; font-size: 11px; color: #0d9488; font-weight: 400; text-transform: uppercase; letter-spacing: 1px;">Design &amp; Technology</p>
        
        <table cellpadding="0" cellspacing="0" border="0" style="font-size: 13px; color: #475569; font-weight: 300;">
          <tr>
            <td style="padding-bottom: 5px;">
              <span style="color: #0d9488; font-weight: 600; font-size: 11px; margin-right: 8px;">E</span> 
              <a href="mailto:info@atlasdt.com" style="color: #334155; text-decoration: none;">info@atlasdt.com</a>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom: 5px;">
              <span style="color: #0d9488; font-weight: 600; font-size: 11px; margin-right: 8px;">P</span> 
              <a href="tel:+610406238458" style="color: #334155; text-decoration: none;">+61 0406 238 458</a>
            </td>
          </tr>
          <tr>
            <td>
              <span style="color: #0d9488; font-weight: 600; font-size: 11px; margin-right: 8px;">W</span> 
              <a href="https://www.atlasdt.com" style="color: #334155; text-decoration: none;">www.atlasdt.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <!-- Copy everything above this line into your email client -->
