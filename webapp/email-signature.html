<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AtlasDT Email Signature</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #ffffff; padding: 40px;">

  <!-- INSTRUCTIONS FOR USER: 
       1. Open this file in your browser.
       2. Press Ctrl+A (or Cmd+A) to select everything.
       3. Press Ctrl+C (or Cmd+C) to copy.
       4. Open Outlook -> Settings -> Signatures -> Paste (Ctrl+V) into the signature box.
       5. You can then edit the text (Name, Title, etc.) directly in Outlook!
  -->

  <table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #333333; line-height: 1.5; width: 100%; max-width: 600px; border-collapse: collapse;">
    <tr>
      <!-- Left Column: Logo -->
      <td valign="middle" style="padding-right: 24px; width: 140px; text-align: center;">
        <a href="https://www.atlasdt.com" target="_blank" style="text-decoration: none;">
          <img src="https://raw.githubusercontent.com/marco2683/atlax-webapp/main/webapp/public/logos/atlasdt-logo-full.png" alt="AtlasDT Logo" width="130" style="display: block; border: none; max-width: 130px; height: auto;" />
        </a>
      </td>

      <!-- Vertical Separator (Blue) -->
      <td width="2" style="background-color: #0ea5e9; width: 2px;"></td>

      <!-- Right Column: Details -->
      <td valign="middle" style="padding-left: 24px; min-width: 350px;">
        
        <!-- Name and Title -->
        <div style="font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 1px; letter-spacing: 0.5px; white-space: nowrap; line-height: 1.3;">Marco Sebastiani</div>
        <div style="font-size: 14px; color: #0ea5e9; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; white-space: nowrap; line-height: 1.3;">Founder</div>
        
        <!-- Contact Details -->
        <table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #475569; border-collapse: collapse; white-space: nowrap; line-height: 1.3;">
          <tr>
            <td valign="middle" style="padding-bottom: 3px; padding-right: 10px; font-weight: 900; color: #0ea5e9; white-space: nowrap;">E</td>
            <td valign="middle" style="padding-bottom: 3px; white-space: nowrap;"><a href="mailto:marco@atlasdt.com" style="color: #475569; text-decoration: none;">marco@atlasdt.com</a></td>
          </tr>
          <tr>
            <td valign="middle" style="padding-bottom: 3px; padding-right: 10px; font-weight: 900; color: #0ea5e9; white-space: nowrap;">P</td>
            <td valign="middle" style="padding-bottom: 3px; white-space: nowrap;"><a href="tel:+610406238458" style="color: #475569; text-decoration: none;">+61 0406 238 458</a></td>
          </tr>
          <tr>
            <td valign="middle" style="padding-bottom: 3px; padding-right: 10px; font-weight: 900; color: #0ea5e9; white-space: nowrap;">W</td>
            <td valign="middle" style="padding-bottom: 3px; white-space: nowrap;"><a href="https://www.atlasdt.com" style="color: #475569; text-decoration: none;">www.atlasdt.com</a></td>
          </tr>
        </table>

        <!-- Address & Separator -->
        <div style="border-top: 1px solid #e2e8f0; margin-top: 8px; padding-top: 8px; font-size: 12px; color: #64748b; line-height: 1.4; white-space: nowrap;">
          <strong>AtlasDT</strong><br />
          Corner Carrington Rd & Thurston St,<br />
          Suite 10/1 Main St, Box Hill VIC 3128
        </div>

      </td>
    </tr>
  </table>

</body>
</html>
