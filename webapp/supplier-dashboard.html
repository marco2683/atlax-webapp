<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas DT — Supplier Portal</title>
  <meta name="description" content="AtlasDT Supplier Portal — Manage your product catalog, track orders, and grow your B2B presence.">
  <link rel="stylesheet" href="/src/css/supplier-amazon.css">
  <link rel="stylesheet" href="/src/css/supplier-onboarding.css">
</head>
<body>
  <!-- Loading State -->
  <div id="supplier-loading" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--sp-bg, #0B0F19); z-index: 999; display: flex; justify-content: center; align-items: center;">
    <div style="text-align: center;">
      <div style="width: 32px; height: 32px; border: 3px solid rgba(59,130,246,0.2); border-top-color: #3B82F6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
      <p style="color: #94A3B8; font-weight: 500; font-size: 14px; font-family: 'Inter', sans-serif;">Loading Portal...</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- Onboarding (unchanged logic, restyled) -->
  <div id="supplier-onboarding" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--sp-bg, #0B0F19); z-index: 999; justify-content: center; align-items: center;">
    <div style="background: var(--sp-bg-raised, #111827); border: 1px solid rgba(148,163,184,0.12); border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); width: 440px; padding: 36px;">
      <h2 style="margin: 0 0 8px 0; font-size: 18px; color: #F1F5F9; font-weight: 700;">Register as a Supplier</h2>
      <p style="color: #94A3B8; font-size: 13px; margin-bottom: 24px;">Link your account to a supplier profile or register a new facility.</p>
      <form id="onboarding-form">
        <div style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px;">Legal Business Name</label>
          <input type="text" id="onboard-factory-name" required placeholder="Shenzhen Precision Manufacturing Ltd." class="amz-form-input">
        </div>
        <div style="margin-bottom: 24px;">
          <label style="display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px;">Primary Focus</label>
          <select id="onboard-factory-focus" required class="amz-form-input">
            <option value="OEM">Original Equipment Manufacturer (OEM)</option>
            <option value="DISTRIBUTOR">Component Distributor</option>
            <option value="CM">Contract Manufacturer</option>
          </select>
        </div>
        <button type="submit" style="width: 100%; padding: 12px; background: #3B82F6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.2s;">Create Profile & Continue</button>
      </form>
    </div>
  </div>

  <!-- Main Portal App -->
  <div id="supplier-app" style="display: none; min-height: 100vh; flex-direction: column;">

    <!-- ═══ HEADER / NAV ═══ -->
    <header class="sp-header">
      <div class="sp-header-inner">
        <div class="sp-header-left">
          <div class="sp-header-logo">
            <img src="/logos/atlasdt-logo-full.svg" alt="AtlasDT">
            <div class="sp-logo-divider"></div>
            <span class="sp-portal-badge">Supplier Portal</span>
          </div>
          <div class="sp-factory-name" id="sidebar-factory-name">My Factory</div>
        </div>

        <nav class="sp-header-nav">
          <a class="sp-nav-link active" id="nav-dashboard">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
          </a>
          <a class="sp-nav-link" id="nav-inventory">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            Products
          </a>
          <a class="sp-nav-link" id="nav-orders">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
            Orders & RFQs
          </a>
          <a class="sp-nav-link" id="nav-publish">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Product
          </a>
          <a class="sp-nav-link" id="nav-profile">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M9 8h1"/><path d="M9 12h1"/><path d="M9 16h1"/><path d="M14 8h1"/><path d="M14 12h1"/><path d="M14 16h1"/><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/></svg>
            Company Profile
          </a>
          <a class="sp-nav-link" id="nav-team">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Team
          </a>
        </nav>

        <div class="sp-header-right">
          <button class="sp-theme-toggle" id="sp-theme-toggle" title="Toggle light/dark theme">☀️</button>
          <button class="sp-icon-btn" title="Notifications" id="btn-notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="sp-badge"></span>
          </button>
          <div class="sp-avatar" id="sp-avatar-initials">SP</div>
          <button class="sp-logout-btn" id="supplier-logout-btn">Sign Out</button>
        </div>
      </div>
    </header>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main id="supplier-content-routing">
      <!-- Injected via JS -->
    </main>

  </div>

  <script type="module" src="/src/js/supplier-dashboard.js"></script>
  <script type="text/javascript" src="https://res.public.onecdn.static.microsoft/customerconnect/v1/7dttl/init.js" id="chatbot" environmentId="016ca71b-616b-e187-b02d-3fcb9c6568c2" crossorigin="anonymous"></script>
</body>
</html>
